<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenRouter AI Chat</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="app">
    <!-- ── Header ── -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M12 2C6.48 2 2 6.48 2 12c0 2.1.74 4.03 1.97 5.56L2 22l4.44-1.97C7.97 21.26 9.9 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2z" fill="#6366f1"/>
            <path d="M8 11h8v2H8zm0-3h8v2H8zm0 6h5v2H8z" fill="#fff" opacity="0.9"/>
          </svg>
        </div>
        <span class="title">AI Chat</span>
      </div>
      <div class="header-right">
        <button id="btn-clear" class="icon-btn" title="Clear chat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
        </button>
        <button id="btn-settings" class="icon-btn" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- ── Model Bar ── -->
    <div class="model-bar">
      <select id="model-select" class="model-select"></select>
      <span id="status-dot" class="status-dot" title="API key not set"></span>
    </div>

    <!-- ── Messages ── -->
    <div id="chat-messages" class="messages">
      <div class="welcome">
        <div class="welcome-icon">✨</div>
        <h3>Welcome to AI Chat</h3>
        <p>Select a model and start conversations.<br>Configure your API key in Settings.</p>
      </div>
    </div>

    <!-- ── Input ── -->
    <div class="input-area">
      <div class="input-wrap">
        <textarea id="msg-input" placeholder="Type a message…" rows="1"></textarea>
      </div>
      <button id="btn-send" class="send-btn" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <!-- ── Settings Modal ── -->
  <div id="settings-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>Settings</h2>
        <button id="modal-close" class="icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label for="api-key">OpenRouter API Key</label>
          <div class="input-row">
            <input type="password" id="api-key" placeholder="sk-or-v1-…">
            <button id="btn-save-key" class="btn btn-primary">Save</button>
          </div>
          <p class="hint">Get your free key at <a href="https://openrouter.ai/keys" target="_blank">openrouter.ai/keys</a></p>
        </div>

        <div class="form-group">
          <label>Theme</label>
          <label class="toggle">
            <input type="checkbox" id="theme-toggle">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span class="toggle-label">Dark mode</span>
          </label>
        </div>

        <div class="form-group">
          <label class="toggle">
            <input type="checkbox" id="save-history-toggle" checked>
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span class="toggle-label">Save chat history</span>
          </label>
        </div>

        <div id="toast-container" class="toast-container"></div>
      </div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
